<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tempo compatibility fixture</title><link rel="stylesheet" href="fixture.css"></head>
<body><main><h1>Tempo compatibility fixture</h1><p>Local videos, dynamic players, source changes, open shadow roots, and cross-origin frames.</p>
<div class="actions"><button id="add">Add video</button><button id="replace">Replace first video</button><button id="shadow">Add shadow player</button><button id="late-shadow">Attach delayed shadow root</button><button id="frame">Add cross-origin frame</button><button id="navigate">SPA navigation</button><button id="reject">Toggle rate-resetting player</button></div>
<section id="players"><video id="primary" controls muted></video><video id="secondary" controls muted></video></section>
<p id="message">Choose a speed in Tempo, then try each case above. Generated media stays in this browser.</p></main><script src="fixture.js"></script></body></html>
